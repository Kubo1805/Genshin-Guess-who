<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Guess Who</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #572d42;
      --muted: #80596a;
      --pink: #e6789b;
      --pink-deep: #9e3658;
      --blush: #ffdce6;
      --baby-pink: #fff0f5;
      --cream: #fffdf5;
      --butter: #ffe79a;
      --line: #f2b7c8;
      --violet: #7658a8;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .page-shell {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.8) 0 3%, transparent 3.2%),
        radial-gradient(circle at 88% 13%, rgba(255,231,154,.7) 0 4%, transparent 4.2%),
        linear-gradient(145deg, #fff4f7, #ffdfe9 48%, #fff7d9);
    }

    .page-shell::before,
    .page-shell::after {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      font-family: "Fraunces", serif;
      line-height: 1;
    }

    .page-shell::before {
      content: "♥";
      top: 2rem;
      left: -2.6rem;
      color: rgba(230,120,155,.15);
      font-size: 12rem;
      transform: rotate(-15deg);
    }

    .page-shell::after {
      content: "✦  ♡";
      right: -2.5rem;
      bottom: 2rem;
      color: rgba(255,205,94,.42);
      font-size: 7rem;
      letter-spacing: .4rem;
      transform: rotate(12deg);
    }

    .main-content {
      width: 100%;
      max-width: 1540px;
      margin: 0 auto;
      padding: 1rem;
      position: relative;
      z-index: 1;
    }

    .title-font { font-family: "Fraunces", serif; }

    .soft-card {
      box-shadow: 0 15px 35px rgba(158,54,88,.13), inset 0 2px 0 rgba(255,255,255,.9);
    }

    .game-controls {
      position: sticky;
      top: .5rem;
      z-index: 20;
      backdrop-filter: blur(14px);
    }

    .game-button {
      min-height: 2.55rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .42rem;
      border: 2px solid transparent;
      border-radius: 1rem;
      padding: .55rem .84rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .game-button:hover { transform: translateY(-2px) rotate(-.35deg); filter: saturate(1.08); }
    .game-button:active { transform: translateY(0); }


    .game-button:disabled { opacity:.48; cursor:not-allowed; transform:none !important; filter:none !important; }

    .game-button:focus-visible,
    .character-toggle:focus-visible,
    .picture-picker:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 3px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: .65rem;
    }

    .character-card {
      min-width: 0;
      position: relative;
      border: 2px solid var(--line);
      border-radius: 1.05rem;
      padding: .42rem;
      background: var(--cream);
      box-shadow: 0 5px 0 rgba(228,125,157,.16);
      transition: transform .16s ease, opacity .18s ease, filter .18s ease, border-color .18s ease;
    }

    .character-card:hover { transform: translateY(-3px); border-color: var(--pink); }

    .character-card.is-eliminated {
      position: relative;
      border-color: #c6284f;
    }

    .character-card.is-eliminated::after {
      content: "";
      position: absolute;
      inset: .42rem;
      z-index: 7;
      border-radius: .78rem;
      background: rgba(198,40,79,.18);
      pointer-events: none;
    }

    .character-card.is-eliminated .portrait-slot::before,
    .character-card.is-eliminated .portrait-slot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 8;
      width: 82%;
      height: 9px;
      border-radius: 999px;
      background: #c6284f;
      box-shadow: 0 1px 0 rgba(255,255,255,.65);
      pointer-events: none;
    }

    .character-card.is-eliminated .portrait-slot::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .character-card.is-eliminated .portrait-slot::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .portrait-slot {
      height: 150px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.95);
      border-radius: .78rem;
      background: linear-gradient(145deg, var(--bg1, #ffdce6), var(--bg2, #ffe79a));
    }

    .portrait-slot.has-custom { background: #ffdce6; }

    .custom-picture {
      width: 100%;
      height: 100%;
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      object-fit: cover;
    }

    .portrait-slot.has-custom .custom-picture { display: block; }

    .character-image {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      z-index: 4;
      object-fit: cover;
    }

    .character-image.is-missing {
      display: none;
    }

    .portrait-art { display: block; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      .main-content { padding: .7rem; }
      .board-wrap { overflow-x: auto; padding-bottom: .65rem; }
      .board-grid { min-width: 760px; grid-template-columns: repeat(10, 1fr); }
      .game-controls { top: .25rem; }
    }
  </style>
 </head>

  <template id="characterTemplate">
   <article data-template-id="character-card" class="canva-card character-card">
    <button data-template-id="character-toggle" class="canva-button character-toggle" type="button">
     <div data-template-id="character-portrait" class="canva-card portrait-slot" aria-hidden="true">
      <img data-template-id="character-portrait-image" class="character-image" loading="lazy" alt="">
      <div class="portrait-art">
       <div class="portrait-hair"></div>
       <div class="portrait-face"></div>
       <div class="portrait-glasses"></div>
       <div class="portrait-hat"></div>
       <div class="portrait-beard"></div>
       <div class="portrait-shirt"></div>
      </div>
     </div><span data-template-id="character-name" class="canva-text character-name"></span> <span class="sr-only character-status" aria-live="polite"></span> </button>
   </article>
  </template>
  <script>
    const names = [
      "Aether","Aino","Albedo","Al Haitham","Alice","Aloy","Alyosha","Amber","Arataki Itto","Arlecchino",
      "Baizhu","Barbara","Beidou","Bennett","Candace","Capitano","Charlotte","Chasca","Chevreuse","Chiori",
      "Chongyun","Citlali","Clorinde","Collei","Columbina","Cyno","Dahlia","Dainsleif","Dehya","Diluc",
      "Diona","Dori","Durin","Ei","Emilie","Escoffier","Eula","Faruzan","Fischl","Flins",
      "Freminet","Furina","Gaming","Ganyu","Gorou","Hu Tao","Iansan","Ifa","Il Dottore","Illuga",
      "Ineffa","Jahoda","Jean","Kachina","Kaedehara Kazuha","Kaeya","Kamisato Ayaka","Kamisato Ayato","Kaveh","Keqing",
      "Kinich","Kirara","Klee","Kujou Sara","Kuki Shinobu","Lan Yan","La Signora","Lauma","Layla","Linnea",
      "Lisa","Lohen","Lumine","Lynette","Lyney","Mavuika","Mika","Mitya","Mona","Mualani",
      "Navia","Nefer","Neuvillette","Nicole","Nilou","Ningguang","Noelle","Odette","Ororon","Paimon",
      "Pantalone","Prune","Qiqi","Razor","Rosaria","Sandrone","Sangonomiya Kokomi","Sayi","Sethos","Shenhe",
      "Shikanoin Heizou","Sigewinne","Skirk","Sucrose","Tartaglia","Thoma","Tighnari","Varesa","Varka","Venti",
      "Vesna","Vodyanitsa","Wanderer","Wriothesley","Xiangling","Xianyun","Xiao","Xilonen","Xingqiu","Xinyan",
      "Yae Miko","Yanfei","Yao Yao","Yelan","Yoimiya","Yumemizuki Mizuki","Yun Jin","Zhongli","Zibai"
    ];

    const skins = ["#f7d1af","#e9ae82","#c98762","#9a5b41","#75402d","#f0bd96","#b96d4d","#d89b75"];
    const hairs = ["#2a1a16","#553222","#8a5334","#d59a47","#562b48","#244a3a","#bd5f32","#d8d0c5"];
    const shirts = ["#9077bf","#df7591","#5eaa94","#e5ae55","#7086bf","#e987a4","#5098aa","#bd7f59"];
    const hats = ["#df7591","#9077bf","#e5ae55","#5eaa94","#b390d4"];
    const backgrounds = [
      ["#ffdce6","#ffe79a"],["#ffcdbb","#ffdce6"],["#ded3f5","#ffdce6"],
      ["#ffe79a","#ded3f5"],["#ffdce6","#ffcdbb"]
    ];
    const stateKey = "genshin_guess_who_baby_pink_v5";

    let game = {
      eliminated: [],
      secretId: null,
      search: ""
    };

    function makeCharacters() {
      return names.map((name, index) => ({
        id: index + 1,
        name,
        traits: {
          glasses: index % 4 === 0 || index % 13 === 0,
          hats: index % 5 === 0 || index % 17 === 0,
          facialHair: index % 3 === 0,
          longHair: index % 4 === 1 || index % 11 === 0
        },
        skin: skins[index % skins.length],
        hair: hairs[(index * 3) % hairs.length],
        shirt: shirts[(index * 5) % shirts.length],
        hat: hats[index % hats.length],
        background: backgrounds[index % backgrounds.length]
      }));
    }

    const characters = makeCharacters();
    const huTaoId = names.indexOf("Hu Tao") + 1;
    const laterCharacterIds = new Set(characters.filter(character => character.id > huTaoId).map(character => character.id));

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(stateKey));
        if (saved && typeof saved === "object") {
          game.eliminated = Array.isArray(saved.eliminated) ? saved.eliminated : [];
          game.secretId = Number.isInteger(saved.secretId) ? saved.secretId : null;
          game.search = typeof saved.search === "string" ? saved.search : "";
        }
      } catch (error) {
        game = { eliminated: [], secretId: null, search: "" };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(stateKey, JSON.stringify(game));
        return true;
      } catch (error) {
        showMessage("That picture is too large to save here. Try a smaller image.", "warm");
        return false;
      }
    }

    function showMessage(message, tone) {
      const messageEl = document.getElementById("gameMessage");
      messageEl.textContent = message;
      messageEl.className = "mt-3 rounded-xl px-3 py-2 text-center text-sm font-bold";
      messageEl.classList.add(tone === "success" ? "bg-[#e8f6e9] text-[#386f50]" : "bg-[#fff1c9] text-[#765018]");
    }

    function hideMessage() {
      document.getElementById("gameMessage").className = "mt-3 hidden rounded-xl px-3 py-2 text-center text-sm font-bold";
    }

    function filteredCharacters() {
      const query = game.search.trim().toLowerCase();
      return characters.filter(character => !query || character.name.toLowerCase().includes(query));
    }

    function imagePathFor(character) {
      // Put each character image in /images using the exact character name, e.g.
      // images/Aether.png, images/Barbara.png, images/Kaedehara%20Kazuha.png
      return "images/" + encodeURIComponent(character.name) + ".png";
    }

    function setCharacterImage(image, portrait, character) {
      image.src = imagePathFor(character);
      image.alt = character.name;
      image.classList.remove("is-missing");

      image.onload = () => {
        image.classList.remove("is-missing");
      };

      image.onerror = () => {
        image.classList.add("is-missing");
      };
    }

    function applyPortrait(portrait, character) {
      const art = portrait.querySelector(".portrait-art");
      const image = portrait.querySelector(".character-image");

      portrait.style.setProperty("--bg1", character.background[0]);
      portrait.style.setProperty("--bg2", character.background[1]);
      art.style.setProperty("--hair", character.hair);
      art.style.setProperty("--skin", character.skin);
      art.style.setProperty("--shirt", character.shirt);
      art.style.setProperty("--hat", character.hat);
      art.classList.toggle("has-glasses", character.traits.glasses);
      art.classList.toggle("has-hat", character.traits.hats);
      art.classList.toggle("has-facial-hair", character.traits.facialHair);
      art.classList.toggle("long-hair", character.traits.longHair);

      setCharacterImage(image, portrait, character);
    }

    function createCard(character) {
      const fragment = document.getElementById("characterTemplate").content.cloneNode(true);
      const card = fragment.querySelector(".character-card");
      const toggle = fragment.querySelector(".character-toggle");
      const portrait = fragment.querySelector(".portrait-slot");
      const name = fragment.querySelector(".character-name");

      card.dataset.characterId = character.id;
      name.textContent = character.name;
      applyPortrait(portrait, character);

      toggle.addEventListener("click", () => toggleCharacter(character.id));

      return card;
    }

    function updateCard(card, character) {
      const eliminated = game.eliminated.includes(character.id);
      const toggle = card.querySelector(".character-toggle");
      const status = card.querySelector(".character-status");
      const portrait = card.querySelector(".portrait-slot");

      card.classList.toggle("is-eliminated", eliminated);
      toggle.setAttribute("aria-pressed", String(eliminated));
      toggle.setAttribute("aria-label", character.name + (eliminated ? ", crossed out. Activate to restore." : ", active. Activate to cross out."));
      status.textContent = eliminated ? character.name + " is crossed out." : character.name + " is active.";
      applyPortrait(portrait, character);
    }

    function renderBoard() {
      const board = document.getElementById("characterBoard");
      const visible = filteredCharacters();
      const existing = new Map([...board.children].map(card => [Number(card.dataset.characterId), card]));
      const visibleIds = new Set(visible.map(character => character.id));

      existing.forEach((card, id) => {
        if (!visibleIds.has(id)) card.remove();
      });

      visible.forEach(character => {
        let card = board.querySelector('[data-character-id="' + character.id + '"]');
        if (!card) {
          card = createCard(character);
          board.appendChild(card);
        }
        updateCard(card, character);
      });

      updateCounter();
      if (window.lucide) lucide.createIcons();
    }

    function updateCounter() {
      const eliminatedCount = game.eliminated.length;
      document.getElementById("counterText").textContent = (characters.length - eliminatedCount) + " active · " + eliminatedCount + " crossed out";
    }

    function toggleCharacter(id) {
      if (game.eliminated.includes(id)) {
        game.eliminated = game.eliminated.filter(item => item !== id);
      } else {
        game.eliminated.push(id);
      }
      saveState();
      renderBoard();
    }

    function chooseRandomSecret() {
      game.secretId = characters[Math.floor(Math.random() * characters.length)].id;
      saveState();
      hideMessage();
      renderSecret();
    }

    function populateManualPicker(query = "") {
      const select = document.getElementById("manualCharacterSelect");
      const normalized = query.trim().toLowerCase();
      const matches = characters.filter(character => !normalized || character.name.toLowerCase().includes(normalized));
      select.replaceChildren();
      matches.forEach(character => {
        const option = document.createElement("option");
        option.value = String(character.id);
        option.textContent = character.name;
        select.appendChild(option);
      });
      if (game.secretId && matches.some(character => character.id === game.secretId)) select.value = String(game.secretId);
    }

    function chooseManualSecret() {
      const id = Number(document.getElementById("manualCharacterSelect").value);
      if (!id) return;
      game.secretId = id;
      saveState();
      hideMessage();
      renderSecret();
    }

    function renderSecret() {
      const empty = document.getElementById("secretEmpty");
      const selected = document.getElementById("secretSelected");
      const preview = document.getElementById("secretPreview");
      const pickAgain = document.getElementById("pickAgain");
      const clearButton = document.getElementById("clearSecret");
      const character = characters.find(item => item.id === game.secretId);

      empty.classList.add("hidden");
      selected.classList.add("hidden");
      selected.classList.remove("flex");
      preview.classList.remove("is-picked");

      const hasSecret = Boolean(character);
      pickAgain.disabled = !hasSecret;
      clearButton.disabled = !hasSecret;

      if (!hasSecret) {
        empty.classList.remove("hidden");
        return;
      }

      preview.classList.add("is-picked");
      selected.classList.remove("hidden");
      selected.classList.add("flex");
      document.getElementById("secretName").textContent = character.name;
      applyPortrait(document.getElementById("secretPortrait"), character);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadState();

      const searchInput = document.getElementById("characterSearch");
      searchInput.value = game.search;

      searchInput.addEventListener("input", event => {
        game.search = event.target.value;
        saveState();
        renderBoard();
      });

      const manualPicker = document.getElementById("manualPicker");
      const chooseManually = document.getElementById("chooseManually");
      const manualSearch = document.getElementById("manualCharacterSearch");
      const manualSelect = document.getElementById("manualCharacterSelect");
      populateManualPicker();
      chooseManually.addEventListener("click", () => {
        const isOpen = manualPicker.classList.toggle("hidden");
        chooseManually.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) manualSearch.focus();
      });
      manualSearch.addEventListener("input", event => populateManualPicker(event.target.value));
      manualSelect.addEventListener("change", chooseManualSecret);

      document.getElementById("pickSecret").addEventListener("click", chooseRandomSecret);

      document.getElementById("pickAgain").addEventListener("click", () => {
        if (game.secretId) chooseRandomSecret();
      });

      document.getElementById("clearSecret").addEventListener("click", () => {
        game.secretId = null;
        saveState();
        renderSecret();
      });

      document.getElementById("newRound").addEventListener("click", () => {
        game.eliminated = [];
        game.secretId = null;
        game.search = "";
        searchInput.value = "";
        saveState();
        hideMessage();
        renderBoard();
        renderSecret();
      });

      document.getElementById("resetEliminated").addEventListener("click", () => {
        game.eliminated = [];
        saveState();
        renderBoard();
        showMessage("Every card is active again.", "success");
      });

      renderBoard();
      renderSecret();

      if (window.lucide) lucide.createIcons();
    });
  </script>
 
</body></html>
